services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3308}:3306'
    volumes:
      - restly_hub_mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sh:/docker-entrypoint-initdb.d/mysql-init.sh
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&connectionLimit=5
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      CORS_ORIGIN: ${CORS_ORIGIN}
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-}
      AGENT_URL: ${AGENT_URL:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      HUB_SIGNING_PRIVATE_KEY: ${HUB_SIGNING_PRIVATE_KEY:-}
      SWAGGER_USER: ${SWAGGER_USER:-}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:-}
      PORT: 3100
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3100}:3100'
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_OPTIONS: --max-old-space-size=192
      API_PROXY_TARGET: http://backend:3100
    ports:
      - '${FRONTEND_PORT:-5174}:5174'
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  restly_hub_mysql_data:

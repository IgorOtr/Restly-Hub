services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-128M}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    volumes:
      - restly_hub_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.prod.Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: ${BACKEND_MEM_LIMIT:-384m}
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&connectionLimit=5
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      CORS_ORIGIN: ${CORS_ORIGIN}
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL}
      # Recomendado em produção: manter a chave fora do banco (e com backup seguro).
      HUB_SIGNING_PRIVATE_KEY: ${HUB_SIGNING_PRIVATE_KEY:-}
      TRUST_PROXY: '1'
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NODE_ENV: production
      NODE_FLAGS: ${NODE_FLAGS:---max-old-space-size=256}
      PORT: 3100
      TZ: ${TZ:-America/Sao_Paulo}

  web:
    build:
      context: .
      dockerfile: docker/frontend.prod.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${HTTP_PORT:-80}:80'

volumes:
  restly_hub_mysql_data:

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;
    limit_conn conn 100;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Ative ao servir via HTTPS (obrigatório em produção):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^/api/auth/(login|register-admin)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:3100;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Consultas de licença das instalações (podem vir todas do mesmo servidor).
    location = /api/licenses/check {
        proxy_pass http://backend:3100;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend:3100;
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_read_timeout 30s;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}

# Site de vendas (estático). Só as rotas públicas do site vão para a API do Hub.
limit_req_zone $binary_remote_addr zone=site_leads:10m rate=6r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 32k;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Ative ao servir via HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/public/site/leads {
        limit_req zone=site_leads burst=5 nodelay;
        proxy_pass http://backend:3100;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
    location = /api/public/site/config {
        proxy_pass http://backend:3100;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
    # Nenhuma outra rota da API é exposta pelo site.
    location /api/ {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

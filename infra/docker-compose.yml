# Infraestrutura compartilhada das instalações do Restly (uma por servidor):
#   traefik → roteia cada subdomínio          mysql → um banco por cliente
#   agent   → cria/gerencia as instalações e o frontend único (restly-web) a pedido do Hub
# Cada cliente ganha apenas o seu container de API (criado pelo agent).
name: restly-infra

services:
  traefik:
    # v3.6+ é necessário com Docker Engine 29 (versão mínima da API).
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=restly-edge
      - --entrypoints.web.address=:80
      - --log.level=WARN
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]

  mysql:
    image: mysql:8.4
    container_name: restly-infra-mysql
    restart: unless-stopped
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-512M}
      - --max-connections=500
      - --table-open-cache=2000
      - --table-definition-cache=2000
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      edge:
        aliases: [restly-mysql]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  agent:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      AGENT_TOKEN: ${AGENT_TOKEN:?defina AGENT_TOKEN}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      PUBLIC_PORT: ${PUBLIC_PORT:-}
      TLS_ENABLED: ${TLS_ENABLED:-false}
      RESTLY_BACKEND_IMAGE: ${RESTLY_BACKEND_IMAGE:-restly-backend:local}
      RESTLY_WEB_IMAGE: ${RESTLY_WEB_IMAGE:-restly-web:local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      INSTANCE_NODE_ENV: ${INSTANCE_NODE_ENV:-production}
      INSTANCE_MEM_LIMIT: ${INSTANCE_MEM_LIMIT:-384m}
      LICENSE_CHECK_INTERVAL_SECONDS: ${LICENSE_CHECK_INTERVAL_SECONDS:-300}
      TZ: ${TZ:-America/Sao_Paulo}
    # Acessível apenas pela própria máquina (o Hub fala com ele por aqui ou pela rede interna).
    ports:
      - '127.0.0.1:${AGENT_PORT:-4000}:4000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent_data:/data
    networks: [edge]

volumes:
  mysql_data:
  agent_data:

networks:
  edge:
    name: restly-edge
